name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: portability / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: unsupported-macos
            os: macos-latest
            command: go test ./... -short -count=1 -timeout=900s
          - kind: unsupported-windows
            os: windows-latest
            command: go test ./... -short -count=1 -timeout=900s
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true

      - name: Portability check
        shell: bash
        run: ${{ matrix.command }}
